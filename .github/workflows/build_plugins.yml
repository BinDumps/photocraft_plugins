name: Build & Commit PhotoCraft Plugins Zip

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Grant permission to push commits back to the repo
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain & WASM target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Create output directory
        run: mkdir -p dist

      - name: Discover and compile all plugin crates
        run: |
          find . -maxdepth 2 -name "Cargo.toml" -not -path "*/target/*" | while read -r cargo_file; do
            plugin_dir=$(dirname "$cargo_file")
            
            if [ "$plugin_dir" = "." ]; then
              continue
            fi

            echo "----------------------------------------"
            echo "Building plugin in: $plugin_dir"
            echo "----------------------------------------"
            
            (
              cd "$plugin_dir"
              cargo build --release --target wasm32-unknown-unknown
            )

            find "$plugin_dir/target/wasm32-unknown-unknown/release/" -maxdepth 1 -name "*.wasm" -exec cp {} "$GITHUB_WORKSPACE/dist/" \;
          done

      - name: Create ZIP archive in repo root
        run: |
          cd dist
          zip -9 -r "../photocraft-wasm-plugins.zip" *.wasm
          cd ..
          ls -la photocraft-wasm-plugins.zip

      - name: Commit and push updated ZIP file
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add photocraft-wasm-plugins.zip
          
          # Only commit if there are actual changes to the zip
          if ! git diff --staged --quiet; then
            git commit -m "build: update photocraft-wasm-plugins.zip [skip ci]"
            git push
          else
            echo "No changes in compiled binaries to commit."
          fi
